<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" preserveAspectRatio="xMidYMid slice">
  <!-- Low-poly facets in the InfraBeat profile palette: cyan, blue, violet -->
  <defs>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7fe7f5"/><stop offset="1" stop-color="#3aa0f0"/></linearGradient>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5b7cf0"/><stop offset="1" stop-color="#7a3fd6"/></linearGradient>
    <linearGradient id="c" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a06bf0"/><stop offset="1" stop-color="#4a5de0"/></linearGradient>
  </defs>
  <g opacity=".95">
    <polygon points="0,260 90,180 120,300" fill="url(#a)"/>
    <polygon points="90,180 200,230 120,300" fill="url(#b)" opacity=".85"/>
    <polygon points="0,260 120,300 40,400 0,400" fill="url(#c)"/>
    <polygon points="120,300 200,230 230,360" fill="url(#a)" opacity=".7"/>
    <polygon points="40,400 120,300 230,360 180,400" fill="url(#b)"/>
    <polygon points="200,230 300,300 230,360" fill="url(#c)" opacity=".6"/>
    <polygon points="230,360 300,300 330,400 180,400" fill="url(#a)" opacity=".55"/>
    <polygon points="430,40 520,0 600,0 600,90" fill="url(#a)"/>
    <polygon points="430,40 600,90 500,150" fill="url(#b)" opacity=".9"/>
    <polygon points="500,150 600,90 600,230" fill="url(#c)"/>
    <polygon points="380,120 430,40 500,150" fill="url(#a)" opacity=".6"/>
    <polygon points="500,150 600,230 520,280" fill="url(#a)" opacity=".75"/>
    <polygon points="520,280 600,230 600,360" fill="url(#b)" opacity=".7"/>
    <polygon points="430,220 500,150 520,280" fill="url(#c)" opacity=".45"/>
    <polygon points="0,0 70,0 0,70" fill="url(#c)" opacity=".5"/>
  </g>
</svg>
