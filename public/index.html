<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AP Invoice Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23155e75'/%3E%3Cpath d='M9 22V10h9a4 4 0 010 8h-9' stroke='white' stroke-width='2.6' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='22' cy='22' r='2.6' fill='%235eead4'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f5f6fa; --surface:#ffffff; --raised:#f6f6f9; --sunken:#eef0f6; --line:#e4e6ef; --line-2:#d3d7e4;
  --fg:#16152b; --fg-2:#4a4a63; --muted:#7c7d94;
  --brand:#4b3bc4; --brand-2:#2f5bd8; --brand-ink:#ffffff; --brand-soft:#ecebfb; --brand-glow:#7fe7f5;
  --grad:linear-gradient(120deg,#6a2fa8 0%,#4b3bc4 45%,#2f4ec9 100%); --gold:#f2b705; --ib-blue:#0094c8; --ib-red:#e31e24;
  --series:#4f5fe0;
  --good:#0f8a3c; --good-bg:#e5f5ea; --warn:#a86500; --warn-bg:#fdf1dc; --bad:#c22f2f; --bad-bg:#fbe7e7; --info:#2a5fb0; --info-bg:#e6eefa; --neutral-bg:#eef1f4;
  --shadow:0 1px 2px rgba(15,27,42,.06),0 4px 16px rgba(15,27,42,.06); --shadow-lg:0 12px 40px rgba(15,27,42,.18);
  --r:12px; --r-sm:8px;
  --ui:"Roboto","Segoe UI Variable","Segoe UI",system-ui,-apple-system,sans-serif; --mono:"Cascadia Mono",Consolas,ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e0d1c; --surface:#16152a; --raised:#1b1a33; --sunken:#121126; --line:#2a2947; --line-2:#363558;
  --fg:#e6edf5; --fg-2:#aab8c8; --muted:#7f8ea0;
  --brand:#8b7cf6; --brand-2:#6b8cff; --brand-ink:#0d0b24; --brand-soft:#231f4a; --brand-glow:#7fe7f5; --series:#7a88f0; --grad:linear-gradient(120deg,#5a2894 0%,#3f33a8 45%,#2a44ad 100%); --gold:#f5c542; --ib-blue:#29b6e8; --ib-red:#ff4b50;
  --good:#46c37a; --good-bg:#10301f; --warn:#e8a73c; --warn-bg:#33260f; --bad:#f07373; --bad-bg:#3a1717; --info:#7fb0f0; --info-bg:#13243d; --neutral-bg:#1b2633;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); --shadow-lg:0 12px 40px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e0d1c; --surface:#16152a; --raised:#1b1a33; --sunken:#121126; --line:#2a2947; --line-2:#363558;
  --fg:#e6edf5; --fg-2:#aab8c8; --muted:#7f8ea0;
  --brand:#8b7cf6; --brand-2:#6b8cff; --brand-ink:#0d0b24; --brand-soft:#231f4a; --brand-glow:#7fe7f5; --series:#7a88f0; --grad:linear-gradient(120deg,#5a2894 0%,#3f33a8 45%,#2a44ad 100%); --gold:#f5c542; --ib-blue:#29b6e8; --ib-red:#ff4b50;
  --good:#46c37a; --good-bg:#10301f; --warn:#e8a73c; --warn-bg:#33260f; --bad:#f07373; --bad-bg:#3a1717; --info:#7fb0f0; --info-bg:#13243d; --neutral-bg:#1b2633;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); --shadow-lg:0 12px 40px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--ui);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand-2)}
.mono{font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:12.5px}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--brand-2);outline-offset:2px}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- login ---------- */
#app{min-height:100vh}
.login{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(360px,.9fr)}
@media (max-width:860px){.login{grid-template-columns:minmax(0,1fr)}.login .hero{display:none}}
.hero{position:relative;overflow:hidden;color:#eafcff;padding:56px;display:flex;flex-direction:column;justify-content:space-between;
  background:radial-gradient(1200px 600px at 10% 0%,#1d7f99 0%,transparent 60%),radial-gradient(900px 500px at 100% 100%,#0b4a5e 0%,transparent 60%),linear-gradient(135deg,#0b3c4c,#0e5a70)}
.hero h1{font-size:40px;line-height:1.1;margin:0 0 12px;letter-spacing:-.02em;text-wrap:balance}
.hero p{max-width:46ch;color:#bfe9f3;margin:0;font-size:16px}
.flow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:40px;max-width:640px}
.flow div{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:12px 10px;font-size:12.5px;backdrop-filter:blur(4px)}
.flow b{display:block;font-size:13px;color:#fff;margin-bottom:2px}
.flow div:nth-child(5){background:rgba(94,234,212,.18);border-color:rgba(94,234,212,.5)}
.hero small{color:#9fd3e0}
.brandmark{display:flex;align-items:center;gap:12px;font-weight:700;font-size:18px;letter-spacing:-.01em}
.logo{width:38px;height:38px;border-radius:10px;background:var(--brand);color:#fff;display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}
.hero .logo{background:rgba(255,255,255,.12)}
.form-side{display:grid;place-items:center;padding:32px 16px;background:var(--surface)}
.card-login{width:min(380px,100%)}
.card-login h2{margin:0 0 6px;font-size:24px;letter-spacing:-.01em}
.field{display:grid;gap:6px;margin-top:16px}
.field label{font-size:12.5px;font-weight:600;color:var(--fg-2)}
.input{width:100%;padding:10px 12px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);transition:border-color .15s,box-shadow .15s}
.input:focus{outline:none;border-color:var(--brand-2);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand-2) 22%,transparent)}
.err{color:var(--bad);font-size:13px;margin-top:12px;min-height:18px}
.demo-users{margin-top:22px;padding:12px;border-radius:10px;background:var(--raised);border:1px dashed var(--line-2);font-size:12.5px;color:var(--fg-2)}
.demo-users code{font-family:var(--mono);font-size:12px}
.demo-users summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:6px}
.demo-users summary::-webkit-details-marker{display:none}
.demo-users summary::before{content:"›";display:inline-block;font-weight:700;transition:transform .15s}
.demo-users[open] summary::before{transform:rotate(90deg)}
.demo-users p{margin:10px 0 8px}
.demo-users .pw{background:var(--brand-soft);color:var(--brand);padding:2px 6px;border-radius:6px;font-weight:700}
.demo-tbl{width:100%;border-collapse:collapse;font-size:12.5px;background:var(--surface);border-radius:8px;overflow:hidden}
.demo-tbl th{font-size:11px;padding:6px 8px;position:static}
.demo-tbl td{padding:6px 8px;border-bottom:1px solid var(--line)}
.demo-tbl tr[data-u]{cursor:pointer}
.demo-tbl tr[data-u]:hover td,.demo-tbl tr[data-u]:focus td{background:var(--brand-soft)}
.card-login{width:min(460px,100%)}

/* ---------- buttons, chips ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:8px 14px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-weight:600;font-size:13.5px;white-space:nowrap;transition:background .15s,border-color .15s,transform .05s}
.btn:hover{border-color:var(--brand-2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{background:var(--brand-2);border-color:var(--brand-2)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--sunken)}
.btn.block{width:100%;padding:11px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;color:var(--c);background:var(--cb)}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-PARKED,.s-POSTED,.s-PAID,.s-PASS,.s-good{--c:var(--good);--cb:var(--good-bg)}
.s-READY,.s-accent,.s-INFO{--c:var(--info);--cb:var(--info-bg)}
.s-REVIEW,.s-PART_PAID,.s-WARN,.s-warn{--c:var(--warn);--cb:var(--warn-bg)}
.s-EXCEPTION,.s-REJECTED,.s-BLOCK,.s-bad{--c:var(--bad);--cb:var(--bad-bg)}
.s-PROCESSING,.s-NA,.s-neutral{--c:var(--fg-2);--cb:var(--neutral-bg)}

/* ---------- app shell ---------- */
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100%}
@media (max-width:900px){.shell{grid-template-columns:minmax(0,1fr)}.side{position:fixed;inset:0 auto 0 0;width:260px;z-index:30;transform:translateX(-100%);transition:transform .2s}.side.open{transform:none;box-shadow:var(--shadow-lg)}.menu-btn{display:inline-flex!important}}
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px;gap:4px;position:sticky;top:0;height:100vh}
.side .brandmark{padding:4px 8px 16px;font-size:15.5px}
.side .brandmark small{display:block;font-size:11.5px;font-weight:500;color:var(--muted)}
.nav{all:unset;display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:10px;color:var(--fg-2);cursor:pointer;font-weight:500}
.nav:hover{background:var(--sunken);color:var(--fg)}
.nav[aria-current="page"]{background:var(--brand-soft);color:var(--brand);font-weight:650}
.nav .badge{margin-left:auto;font-size:11px;font-weight:700;background:var(--brand);color:var(--brand-ink);border-radius:999px;padding:1px 7px}
.side .spacer{flex:1}
.side .sys{border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12px;color:var(--fg-2);display:grid;gap:4px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;background:var(--muted)}
.dot.live{background:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 25%,transparent)}
.dot.sim{background:var(--warn)}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:12px 24px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top h1{font-size:19px;margin:0;letter-spacing:-.01em}
.top .sub{color:var(--muted);font-size:12.5px}
.top .grow{flex:1}
.menu-btn{display:none}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--brand-ink);background:linear-gradient(135deg,var(--brand),var(--brand-2))}
.usermenu{position:relative}
.usermenu .pop{position:absolute;right:0;top:44px;width:260px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);padding:8px;display:grid;gap:2px}
.usermenu .pop .who{padding:8px 10px 10px;border-bottom:1px solid var(--line);margin-bottom:4px}
.content{padding:24px;display:grid;gap:20px;max-width:1500px;width:100%}
@media (max-width:600px){.content{padding:16px}.top{padding:12px 16px}}

/* ---------- cards, grids ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.card-h h3{margin:0;font-size:14.5px}
.card-h .grow{flex:1}
.card-b{padding:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.kpi{padding:16px;display:grid;gap:6px;position:relative;overflow:hidden}
.kpi .l{font-size:12.5px;color:var(--fg-2);display:flex;align-items:center;gap:8px}
.kpi .v{font-size:28px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .h{font-size:12px;color:var(--muted)}
.kpi .ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
@media (max-width:1100px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:800px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
.welcome{padding:22px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;
  background:linear-gradient(120deg,var(--brand-soft),var(--surface) 70%);border:1px solid var(--line);border-radius:var(--r)}
.welcome h2{margin:0;font-size:22px;letter-spacing:-.01em}
.welcome p{margin:4px 0 0;color:var(--fg-2)}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.tile{display:flex;flex-direction:column}
.tile .card-h{border-bottom:0;padding-bottom:6px;align-items:flex-start}
.tile .count{font-size:26px;font-weight:700;line-height:1;margin-left:auto;font-variant-numeric:tabular-nums}
.tile .tone{width:4px;align-self:stretch;border-radius:4px;background:var(--c)}
.tile ul{list-style:none;margin:0;padding:0 8px 10px}
.tile li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:8px;border-radius:8px;cursor:pointer}
.tile li:hover{background:var(--sunken)}
.tile li .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile li .s{grid-column:1/-1;font-size:12px;color:var(--muted)}
.tile .empty{padding:6px 16px 18px;color:var(--muted);font-size:13px;display:flex;align-items:center;gap:8px}

/* tables */
.tbl{overflow:auto;border-radius:0 0 var(--r) var(--r)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11.5px;font-weight:650;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:var(--raised);position:sticky;top:0;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--raised)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;background:var(--sunken);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;padding:6px 12px;border-radius:8px;font-size:13px;font-weight:600;color:var(--fg-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.search{position:relative}
.search input{padding-left:34px;width:260px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
.drop{border:2px dashed var(--line-2);border-radius:var(--r);padding:16px;text-align:center;color:var(--fg-2);display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px;transition:background .15s,border-color .15s;cursor:pointer}
.drop.on{border-color:var(--brand-2);background:var(--brand-soft)}

/* invoice drawer */
.scrim{position:fixed;inset:0;background:rgba(8,15,24,.45);z-index:40;animation:fade .15s}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(1120px,100%);background:var(--bg);z-index:41;display:grid;grid-template-rows:auto auto 1fr;box-shadow:var(--shadow-lg);animation:slide .2s ease-out}
@keyframes slide{from{transform:translateX(30px);opacity:.5}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){.drawer,.scrim{animation:none}}
.dhead{background:var(--surface);padding:18px 22px 0;border-bottom:1px solid var(--line);display:grid;gap:12px}
.dtitle{display:flex;gap:12px;align-items:flex-start}
.dtitle h2{margin:0;font-size:20px;letter-spacing:-.01em}
.facts{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:12.5px;color:var(--muted);margin-top:4px}
.facts b{color:var(--fg);font-weight:600}
.tabs{display:flex;gap:2px;overflow-x:auto}
.tabs button{all:unset;cursor:pointer;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--brand);border-color:var(--brand)}
.dbody{overflow:auto;padding:20px 22px;display:grid;gap:16px;align-content:start}
.banner{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 16px;border-radius:var(--r);background:var(--cb);border:1px solid color-mix(in srgb,var(--c) 35%,transparent)}
.banner h3{margin:0;font-size:15px;color:var(--c)}
.banner p{margin:2px 0 0;font-size:13px;color:var(--fg-2)}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.qty{width:96px;padding:7px 9px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface)}
/* agent stepper */
.stepper{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.step{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;font-weight:600;color:var(--fg-2)}
.step i{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:11px;color:#fff;background:var(--c,var(--muted))}
.step.ok{--c:var(--good)} .step.warn{--c:var(--warn)} .step.bad{--c:var(--bad)} .step.wait{--c:var(--line-2)}
.arrow{color:var(--line-2)}
.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:800px){.checks{grid-template-columns:minmax(0,1fr)}}
.chk{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:2px 10px;padding:10px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c)}
.chk .n{font-family:var(--mono);font-size:12px;color:var(--muted);padding-top:1px}
.chk .t{font-weight:600;font-size:13px}
.chk .d{grid-column:2/-1;font-size:12.5px;color:var(--fg-2)}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.kv div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kv span{display:block;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.kv b{font-weight:600;font-size:13.5px;word-break:break-word}
.conf{display:inline-block;width:46px;height:5px;border-radius:3px;background:var(--sunken);overflow:hidden;vertical-align:middle;margin-right:6px}
.conf i{display:block;height:100%;background:var(--good)} .conf i.lo{background:var(--warn)}
.tl{display:grid;gap:0}
.tl .e{display:grid;grid-template-columns:72px 18px minmax(0,1fr);gap:10px;padding:2px 0}
.tl .e .t{font-family:var(--mono);font-size:11.5px;color:var(--muted);padding-top:2px;text-align:right}
.tl .e .m{position:relative}
.tl .e .m::before{content:"";position:absolute;left:5px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--brand-2)}
.tl .e .m::after{content:"";position:absolute;left:8px;top:16px;bottom:-6px;width:2px;background:var(--line)}
.tl .e:last-child .m::after{display:none}
.tl .e .x{padding-bottom:10px;font-size:13px}
.tl .e .x b{display:block;font-size:12px;color:var(--brand)}
pre{margin:0;font:12px/1.5 var(--mono);background:var(--sunken);border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto;max-height:420px}
iframe.pdf{width:100%;height:72vh;border:1px solid var(--line);border-radius:10px;background:#fff}
.note{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);font-size:13px;display:grid;gap:4px}
.note .h{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap}
.note .x{white-space:pre-wrap}

/* charts */
.bars{display:grid;gap:10px}

/* agents */
.agents{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.agent{padding:14px;display:grid;gap:6px}
.agent .top2{display:flex;align-items:center;gap:10px}

/* modal, toast */
.modal{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:rgba(8,15,24,.5);padding:16px}
.modal .box{width:min(480px,100%);background:var(--surface);border-radius:16px;box-shadow:var(--shadow-lg);padding:20px;display:grid;gap:12px}
.modal h3{margin:0}
textarea.input{min-height:90px;resize:vertical}
.offline{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:90;background:var(--warn-bg);color:var(--fg);border:1px solid var(--warn);padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600;box-shadow:var(--shadow-lg)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:80;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;box-shadow:var(--shadow-lg);max-width:calc(100% - 32px)}
.empty-state{padding:40px 16px;text-align:center;color:var(--muted);display:grid;gap:8px;place-items:center}
.empty-state svg{width:40px;height:40px;color:var(--line-2)}
.rolechk{display:flex;flex-wrap:wrap;gap:8px}
.rolechk label{display:flex;gap:6px;align-items:center;font-size:13px;padding:4px 8px;border:1px solid var(--line);border-radius:8px}

body{letter-spacing:.005em}
h1,h2,h3,.top h1{font-weight:700}

.hero .logo-chip{width:fit-content;align-self:flex-start;display:inline-flex;align-items:center;gap:12px;background:#fff;border-radius:12px;padding:8px 14px;box-shadow:0 8px 24px rgba(0,0,0,.18)}

/* animated wordmark */
.mb-brand{display:grid;gap:6px;width:fit-content}
.mb-name{display:flex;align-items:center;font-size:44px;font-weight:900;letter-spacing:-.02em;line-height:1;
  background:linear-gradient(100deg,#fff 0%,#fff 40%,#9ff0ff 50%,#fff 60%,#fff 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:mb-shine 6s ease-in-out 2.2s infinite}
.mb-name .ch{display:inline-block;color:transparent;background:inherit;-webkit-background-clip:text;background-clip:text;animation:mb-rise .55s cubic-bezier(.2,.8,.2,1.2) calc(var(--i) * 70ms) both}
.mb-name .tick{width:.62em;height:.62em;margin:0 .14em 0 .16em;flex:none;animation:mb-pop .45s cubic-bezier(.2,.8,.2,1.4) calc(var(--i) * 70ms + 150ms) both}
.mb-name .tick circle{fill:#16a34a}
.mb-name .tick path{fill:none;stroke:#fff;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:16;stroke-dashoffset:16;animation:mb-draw .45s ease-out calc(var(--i) * 70ms + 500ms) forwards}
.mb-line{font-size:15px;font-weight:600;letter-spacing:.04em;color:#e6e2ff}
.mb-line span{display:inline-block;animation:mb-fade .5s ease-out calc(1.1s + var(--j) * .35s) both}

@keyframes mb-rise{from{opacity:0;transform:translateY(.45em) scale(.9)}to{opacity:1;transform:none}}
@keyframes mb-pop{from{opacity:0;transform:scale(.3) rotate(-30deg)}to{opacity:1;transform:none}}
@keyframes mb-draw{to{stroke-dashoffset:0}}
@keyframes mb-fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes mb-shine{0%,70%{background-position:100% 0}100%{background-position:-50% 0}}
/* tick pulse: a soft green ring when the check lands */
.mb-name .tick{overflow:visible}
.mb-name .tick circle{animation:mb-pulse .9s ease-out calc(var(--i) * 70ms + 520ms) 1 both}
@keyframes mb-pulse{0%{filter:drop-shadow(0 0 0 rgba(22,163,74,0))}35%{filter:drop-shadow(0 0 9px rgba(22,163,74,.9))}100%{filter:drop-shadow(0 0 0 rgba(22,163,74,0))}}
/* invoice story: card in (0.3 s) -> checks tick (1.3 / 1.65 / 2.0 s) -> stamp lands (2.45 s) */
.inv-art .ia-card,.inv-art .ia-pill,.inv-art .ia-stamp{transform-box:fill-box;transform-origin:center}
.inv-art .ia-card{animation:ia-in .7s cubic-bezier(.2,.8,.2,1) .3s both}
.inv-art .ia-shadow{animation:ia-fade .7s ease-out .5s both}
.inv-art .ia-pill{animation:ia-pill .5s cubic-bezier(.2,.8,.2,1.3) calc(1.3s + var(--k) * .35s) both}
.inv-art .ia-dot{transform-box:fill-box;transform-origin:center;animation:ia-pop .35s cubic-bezier(.2,.8,.2,1.6) calc(1.45s + var(--k) * .35s) both}
.inv-art .ia-tick{stroke-dasharray:14;stroke-dashoffset:14;animation:mb-draw .35s ease-out calc(1.6s + var(--k) * .35s) forwards}
.inv-art .ia-stamp{animation:ia-stamp .55s cubic-bezier(.3,1.4,.4,1) 2.45s both}
@keyframes ia-in{from{opacity:0;transform:translateY(26px) rotate(-2deg)}to{opacity:1;transform:none}}
@keyframes ia-fade{from{opacity:0}to{opacity:.18}}
@keyframes ia-pill{from{opacity:0;transform:translateX(-18px) scale(.92)}to{opacity:1;transform:none}}
@keyframes ia-pop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes ia-stamp{0%{opacity:0;transform:scale(2.2) rotate(8deg)}60%{opacity:1;transform:scale(.94)}80%{transform:scale(1.04)}100%{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.mb-name,.mb-name .ch,.mb-name .tick,.mb-name .tick circle,.mb-line span,.inv-art *{animation:none!important}.mb-name .tick path,.inv-art .ia-tick{stroke-dashoffset:0}}

<script>
// ---------------------------------------------------------------- icons
const P = {

  menu:'<path d="M4 6h16M4 12h16M4 18h16"/>', clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>', rupee:'<path d="M7 5h10M7 9h10M7 5c6 0 6 8 0 8l7 6"/>', zap:'<path d="M13 3L5 14h6l-1 7 8-11h-6z"/>',

};
const ic = (n, cls = "i") => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${P[n] ?? ""}</svg>`;

// ---------------------------------------------------------------- helpers
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const inr = n => n == null || n === "" ? "–" : "₹" + Number(n).toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const inr0 = n => n == null ? "–" : "₹" + Number(n).toLocaleString("en-IN", { maximumFractionDigits: 0 });
const tm = iso => iso ? new Date(iso).toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit" }) : "";
const dt = iso => iso ? new Date(iso).toLocaleString("en-IN", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" }) : "";
const LABEL = { PARKED: "Parked", POSTED: "Posted", PAID: "Paid", PART_PAID: "Partly paid", READY: "Ready to park", REVIEW: "Review", EXCEPTION: "Exception", REJECTED: "Rejected", PROCESSING: "Processing",
  PASS: "Pass", WARN: "Warning", BLOCK: "Block", INFO: "Info", NA: "N/A" };
const chip = s => `<span class="chip s-${esc(s)}">${esc(LABEL[s] ?? s)}</span>`;
const initials = n => (n || "?").split(/\s+/).map(w => w[0]).slice(0, 2).join("").toUpperCase();
let ME = null, APP = {}, STATE = null, PAGE = "home", OPEN = null, DTAB = "overview", EDIT = false, FILTER = "open", Q = "", timer = null;
const OPEN_DETAILS = new Set();          // folded boxes the user opened (stay open through auto-refresh)
document.addEventListener("toggle", e => { const f = e.target.dataset?.fold; if (f) e.target.open ? OPEN_DETAILS.add(f) : OPEN_DETAILS.delete(f); }, true);

function toast(m) { $("#toast").innerHTML = `<div class="toast" role="status">${esc(m)}</div>`; clearTimeout(toast.t); toast.t = setTimeout(() => $("#toast").innerHTML = "", 3200); }
async function api(path, body, raw) {
  const opt = body === undefined ? {} : raw ? { method: "POST", body } : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) };
  let r;
  try { r = await fetch(path, opt); }
  catch { throw new Error("Cannot reach Match Book right now (server restarting or network down). Please try again in a moment."); }
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { ME = null; renderLogin(); throw new Error(j.error || "Please sign in"); }
  if (r.status === 403 && j.mustChange) { renderChangePw(true); throw new Error(j.error); }
  if (!r.ok) throw new Error(j.error || `Error ${r.status}`);
  return j;
}
const can = p => ME?.perms.includes(p);
function modal(title, html, okText = "OK", danger) {
  return new Promise(res => {
    const el = document.createElement("div");
    el.className = "modal";

    document.body.appendChild(el);
    const close = v => { el.remove(); res(v); };
    el.querySelector("[data-x]").onclick = () => close(null);
    el.querySelector("[data-ok]").onclick = () => { const t = el.querySelector("textarea,input"); close(t ? t.value : true); };

// ---------------------------------------------------------------- login
// Animated wordmark: letters rise in, a check mark draws between the words, the tagline follows.
function brandMark() {

function go(page) {
  if (!PAGES.find(p => p.id === page && p.show())) page = "home";

  document.querySelectorAll(".nav[data-page]").forEach(b => b.setAttribute("aria-current", b.dataset.page === page ? "page" : "false"));
  const p = PAGES.find(x => x.id === page);
  $("#pt").textContent = p.t;
  $("#content").innerHTML = `<div class="empty-state">${ic("refresh")}Loading…</div>`;
  refresh(false);
}

let lastKey = "";
// someone is typing in a field inside el: the 5-second refresh must not redraw it under them
const typing = el => { const a = document.activeElement; return !!el && !!a && el.contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName); };
function offline(on) {
  let p = $("#offline");
  if (!on) { p?.remove(); return; }
  if (!p) { p = document.createElement("div"); p.id = "offline"; p.className = "offline"; p.setAttribute("role", "status"); document.body.appendChild(p); }
  p.textContent = "Reconnecting to Match Book…";
}
async function refresh(silent) {
  if (!ME || $("#cf") || document.querySelector(".modal") || (EDIT && OPEN)) return;
  try {
    STATE = await api("/api/state");
    offline(false);
    const nb = $("#nb"); if (nb) { nb.hidden = !STATE.unread; nb.textContent = STATE.unread; }
    const R = { home: pHome, invoices: pInvoices, monitor: pMonitor, dashboard: pDashboard, messages: pMessages, agents: pAgents, learning: pLearning, sap: pSap, users: pUsers }[PAGE];
    const html = await R();
    const key = PAGE + html;
    if (!silent || (key !== lastKey && !typing($("#content")))) { const y = scrollY; $("#content").innerHTML = html; lastKey = key; if (silent) scrollTo(0, y); wire(); }
    if (OPEN && !(silent && (typing($("#drawerhost")) || $("#drawerhost")?.querySelector("[data-dirty]")))) renderDrawer(silent);
  } catch (e) {
    if (!silent) $("#content").innerHTML = `<div class="card card-b">${esc(e.message)}</div>`;
    else if (/Cannot reach/.test(e.message)) offline(true);
  }
}

function stepper(inv) {
  const c = id => inv.checks?.find(x => x.id === id);
  const st = inv.status, fin = ["PARKED", "POSTED", "PART_PAID", "PAID"].includes(st);
  const conf = c(0)?.status === "WARN" ? "warn" : inv.extraction ? "ok" : "wait";
  const val = !inv.checks ? "wait" : inv.checks.some(x => x.status === "BLOCK") ? "bad" : inv.checks.some(x => x.status === "WARN") ? "warn" : "ok";
  const rev = st === "REVIEW" || st === "READY" ? "warn" : st === "REJECTED" ? "bad" : inv.override || fin ? "ok" : st === "EXCEPTION" ? "bad" : "wait";
  const steps = [["Read", inv.source ? "ok" : "wait"], ["Extract", conf], ["SAP data", inv.ctx?.po ? "ok" : inv.checks ? "bad" : "wait"], ["Validate", val], ["Review", rev], ["Park", fin ? "ok" : "wait"], ["Posted", ["POSTED", "PART_PAID", "PAID"].includes(st) ? "ok" : "wait"], [st === "PART_PAID" ? "Partly paid" : "Paid", st === "PAID" ? "ok" : st === "PART_PAID" ? "warn" : "wait"]];
  return `<div class="stepper">${steps.map(([l, s], k) => `<span class="step ${s}"><i>${s === "ok" ? "✓" : s === "bad" ? "!" : s === "warn" ? "?" : k + 1}</i>${l}</span>`).join(`<span class="arrow">›</span>`)}</div>`;
}

function drawer(inv) {
  const f = inv.extraction?.fields ?? {};
  const rfc = STATE.sapMode === "rfc", target = rfc ? STATE.sapLabel.split(" (")[0] : "SAP";
  const B = {
    PROCESSING: ["Agents are working on it", "Reading, fetching SAP data and checking…"],
    READY: ["All checks passed: ready to park", `Click to park it in ${target} as a MIRO document.`],
    REVIEW: ["Needs your review", inv.reason], EXCEPTION: ["On hold", inv.reason], REJECTED: ["Rejected", inv.reason],
    PARKED: [`Parked as ${inv.park?.result.INVOICEDOCNUMBER} / ${inv.park?.result.FISCALYEAR}`, `In ${rfc ? STATE.sapLabel : "SAP (simulated)"}. Check and post in MIR4.${inv.override ? ` Override: ${inv.override.reason} (${inv.override.by})` : ""}`],
    POSTED: [`Posted · FI document ${inv.sapStatus?.fiDoc ?? ""}`, `Booked on ${inv.sapStatus?.postedOn ?? ""}. Payment follows the payment terms.`],
    PAID: [`Paid on ${inv.sapStatus?.paidOn ?? ""}`, `Payment document ${inv.sapStatus?.paymentDoc ?? ""}. Requestor and buyer were told.`],
    PART_PAID: [`Partly paid · ${inr(inv.sapStatus?.paidAmount)} of ${inr(inv.sapStatus?.invoiceAmount)}`, `${inr(inv.sapStatus?.openAmount)} still open. Last payment ${inv.sapStatus?.paymentDoc ?? ""} on ${inv.sapStatus?.paidOn ?? ""}; the rest is picked up from SAP when it is paid.`],
  }[inv.status];
  let A = "";
  if (["REVIEW", "READY"].includes(inv.status) && can("park")) A += (inv.lines || []).filter(l => l.ebelp).map(l => `<label class="small" title="${esc(l.desc)}: invoiced ${l.qty}, open ${l.open}">Item ${Number(l.ebelp)} <input class="qty" data-ebelp="${l.ebelp}" type="number" min="0" step="any" value="${inv.suggested?.[l.ebelp] ?? l.qty}" aria-label="Quantity item ${Number(l.ebelp)}"></label>`).join("")
    + `<button class="btn primary" data-a="approve">${ic("check")}${inv.status === "REVIEW" ? "Approve & park" : "Park"} in ${esc(target)}</button>`;
  if (inv.status === "EXCEPTION" && inv.overridable && can("override")) A += `<button class="btn" data-a="override">Approve with override</button>`;
  if (inv.status === "EXCEPTION" && can("review")) A += `<button class="btn" data-a="rerun">${ic("refresh")}Re-check SAP</button>`;
  if (inv.status === "EXCEPTION" && can("demo") && !rfc && inv.checks?.some(c => [2, 3].includes(c.id) && c.status === "BLOCK")) A += `<button class="btn" data-a="seed" title="Creates vendor, PO and GRN in the simulated SAP">Demo: create PO</button>`;
  if (["REVIEW", "READY", "EXCEPTION"].includes(inv.status) && can("review")) A += `<button class="btn danger" data-a="reject">Reject</button>`;
  if (inv.status === "PARKED" && can("demo") && !rfc) A += `<button class="btn" data-a="simulate-post">Demo: post in MIR4</button>`;
  if (["POSTED", "PART_PAID"].includes(inv.status) && can("demo") && !rfc) A += `<button class="btn" data-a="simulate-partpay">Demo: partial payment</button><button class="btn" data-a="simulate-pay">Demo: payment run</button>`;
  if (["PARKED", "POSTED", "PART_PAID"].includes(inv.status) && can("park")) A += `<button class="btn" data-a="sync">${ic("refresh")}Check SAP status</button>`;
  // the PDF belongs on the invoice document, each PO and, once posted, the FI document (same targets as the server)
  const atts = inv.sapAttachments ?? (inv.sapAttachment ? [{ ...inv.sapAttachment, label: "invoice document", tcode: "MIR4" }] : []);
  const wanted = inv.park ? 1 + new Set(inv.park.payload.ITEMDATA.map(i => i.PO_NUMBER).filter(Boolean)).size + (inv.sapStatus?.fiDoc ? 1 : 0) : 0;
  const missing = wanted - atts.filter(a => a.ok).length;
  if (inv.park && missing > 0 && can("park")) A += `<button class="btn" data-a="attach" title="Adds the invoice PDF to the attachment list of the invoice document, the PO and the FI document">${ic("box")}Attach PDF in SAP</button>`;
  // one line, details on click (open state kept across auto-refresh in OPEN_DETAILS)
  const attLine = !inv.park ? "" : `<details class="${missing > 0 ? "warnbox" : "okbox small"} fold" data-fold="att-${inv.id}"${OPEN_DETAILS.has(`att-${inv.id}`) ? " open" : ""}>
      <summary>${missing > 0 ? "" : ic("check")} <b>Invoice PDF in SAP</b> · ${atts.filter(a => a.ok).length} of ${wanted} attached${missing > 0 ? ` · ${missing} still to attach` : ""}</summary>
      <div class="small muted" style="margin:6px 0 2px">Services for Object → Attachment list</div>
      ${atts.map(a => `<div class="small">${a.ok ? "✓" : "✗"} ${esc(a.tcode)} · ${esc(a.label)}${a.ok ? ` · “${esc(a.title)}”` : `: ${esc(a.error)}`}</div>`).join("")}
      ${missing > 0 && !inv.sapStatus?.fiDoc ? `<div class="small">The FI document follows when the invoice is posted.</div>` : ""}</details>`;
  // payments read back from SAP (vendor-line amounts: TDS deducted at payment counts as settled)
  const S = inv.sapStatus ?? {}, pct = S.invoiceAmount ? Math.min(100, Math.round((S.paidAmount / S.invoiceAmount) * 100)) : 0;
  const payLine = !S.payments?.length ? "" : `<div class="${S.openAmount > 0 ? "warnbox" : "okbox small"}" style="display:block">
      <b>Payments in SAP</b> · paid ${inr(S.paidAmount)} of ${inr(S.invoiceAmount)}${S.openAmount > 0 ? ` · <b>${inr(S.openAmount)} open</b>` : " · fully paid"}${S.method && S.openAmount > 0 ? ` <span class="muted">(${esc(S.method)})</span>` : ""}
      <div style="height:6px;border-radius:3px;background:var(--neutral-bg);margin:6px 0"><div style="height:6px;border-radius:3px;width:${pct}%;background:var(--good)"></div></div>
      ${S.payments.map(p => `<div class="small">Document <span class="mono">${esc(p.doc)}</span> · ${esc(p.date)} · ${inr(p.amount)}</div>`).join("")}</div>`;
  const T = [["overview", "Overview"], ["checks", `Checks${inv.checks ? ` (${inv.checks.filter(c => ["BLOCK", "WARN"].includes(c.status)).length})` : ""}`], ["data", "Invoice data"], ["pdf", "PDF"], ["trail", "Agent trail"], ...(inv.park ? [["sap", "SAP document"]] : [])];
  return `<div class="dhead"><div class="dtitle"><div style="flex:1;min-width:0"><h2>${esc(inv.ctx?.vendorName || f.vendor_name || inv.file)}</h2>
      <div class="facts"><span>Invoice <b class="mono">${esc(f.invoice_no || "–")}</b></span><span>Date <b>${esc(f.invoice_date || "–")}</b></span><span>PO <b class="mono">${esc(inv.ctx?.po || f.po_no || "–")}</b></span><span>Amount <b>${inr(f.total)}</b></span><span>Owner <b>${esc(inv.assignedName || inv.assignedTo || "–")}</b></span><span>${ic(inv.source?.type === "Mail" ? "mail" : "box")} ${esc(inv.source?.type === "Mail" ? inv.source.from : "Common folder")}</span></div></div>
      ${chip(inv.status)}<button class="btn ghost" data-close aria-label="Close">${ic("x")}</button></div>
    <div class="tabs" role="tablist">${T.map(([k, l]) => `<button role="tab" data-tab="${k}" aria-selected="${DTAB === k}">${l}</button>`).join("")}</div></div>
    <div class="dbody">${stepper(inv)}
      <div class="banner s-${inv.status}"><div><h3>${esc(B[0])}</h3><p>${esc(B[1] || "")}</p></div><div class="actions">${A}</div></div>
      ${payLine}${attLine}${(inv.extraction?.warnings || []).map(w => `<div class="warnbox">${esc(w)}</div>`).join("")}
      ${dtab(inv)}</div>`;
}

  const FIELDS = [["vendor_name", "Vendor"], ["vendor_gstin", "Vendor GSTIN"], ["vendor_pan", "PAN"], ["invoice_no", "Invoice no."], ["invoice_date", "Invoice date"], ["po_no", "PO no."], ["ship_to_gstin", "Ship-to GSTIN"], ["ship_to_name", "Ship-to name"], ["ship_to_address", "Delivery address"],
    ["lr_no", "LR no."], ["delivery_note", "Delivery note"], ["msme_udyam", "MSME Udyam"], ["irn", "IRN"], ["taxable_value", "Taxable value", 1], ["cgst", "CGST", 1], ["sgst", "SGST", 1], ["igst", "IGST", 1], ["total", "Total", 1]];
  const editable = can("review") && ["REVIEW", "READY", "EXCEPTION"].includes(inv.status);
  if (DTAB === "data") return `<section class="card"><div class="card-h"><h3>Read from the invoice</h3><span class="muted small">${esc(x.engine ?? "")}</span><div class="grow"></div>
      ${editable ? (EDIT ? `<button class="btn" data-a="cancel-edit">Cancel</button><button class="btn primary" data-a="save-edit">${ic("check")}Save & re-check</button>` : `<button class="btn" data-a="edit">Correct values</button>`) : ""}</div>
    <div class="tbl"><table><thead><tr><th>Field</th><th>Value</th><th>Confidence</th></tr></thead><tbody>${FIELDS.map(([k, l, num]) => { const c = x.confidence[k];
      return `<tr><td>${l}</td><td class="mono">${EDIT ? `<input class="input" style="padding:6px 8px" data-f="${k}" value="${esc(f[k] ?? "")}">` : esc(num ? inr(f[k]) : f[k] ?? "–")}</td><td>${c != null ? `<span class="conf"><i class="${c < .9 ? "lo" : ""}" style="width:${c * 100}%"></i></span><span class="small">${Math.round(c * 100)}%</span>` : ""}</td></tr>`; }).join("")}</tbody></table></div></section>
    <section class="card"><div class="card-h"><h3>Line items</h3></div><div class="tbl"><table><thead><tr><th>Description</th><th>HSN/SAC</th><th class="num">Qty</th><th>UoM</th><th class="num">Rate</th><th class="num">Amount</th></tr></thead><tbody>
    ${(f.line_items || []).map((l, n) => `<tr><td>${esc(l.desc)}</td><td class="mono">${esc(l.hsn ?? "")}</td><td class="num">${EDIT ? `<input class="qty" data-l="${n}" data-k="qty" value="${l.qty ?? ""}">` : l.qty ?? ""}</td><td>${esc(l.uom ?? "")}</td><td class="num">${EDIT ? `<input class="qty" data-l="${n}" data-k="rate" value="${l.rate ?? ""}">` : inr(l.rate)}</td><td class="num">${inr(l.amount)}</td></tr>`).join("") || `<tr><td colspan="6" class="muted">No lines read</td></tr>`}</tbody></table></div></section>`;
  // overview
  const bad = (inv.checks || []).filter(c => ["BLOCK", "WARN"].includes(c.status));
  return `<div class="kv">${[["Vendor in SAP", inv.ctx?.vendor ? `${inv.ctx.vendor} · ${inv.ctx.vendorName}` : "–"], ["Company code", inv.ctx?.companyCode ? inv.ctx.companyCode : "–"], ["Plant", inv.ctx?.plant ? `${inv.ctx.plant} ${inv.ctx.plantName ?? ""}` : "–"],
      ["Category", inv.category ?? "–"], ["Buyer (PO creator)", inv.ctx?.buyerName || inv.ctx?.buyer || "–"], ["Requestor", inv.ctx?.requestorName || inv.ctx?.requestor || "–"], ["Tax code", inv.ctx?.taxCode ?? "–"], ["Taxable / GST", `${inr(f.taxable_value)} / ${inr((f.cgst || 0) + (f.sgst || 0) + (f.igst || 0))}`]]
      .map(([k, v]) => `<div><span>${k}</span><b>${esc(v)}</b></div>`).join("")}</div>
    ${inv.sapVendor ? `<section class="card"><div class="card-h"><h3>Vendor master in SAP</h3>${inv.sapVendor.deletionFlag ? `<span class="chip s-WARN">Flagged for deletion</span>` : ""}</div><div class="card-b kv">
      ${[["Address", inv.sapVendor.address || "–"], ["PAN", inv.sapVendor.pan ? `${inv.sapVendor.pan} (${inv.sapVendor.panSource || "SAP"})` : "–"], ["MSME", inv.sapVendor.msme || "Not MSME in SAP"],
        ["GST registered", inv.sapVendor.gstRegistered ? "Yes" : "No"], ["E-mail", inv.sapVendor.email || "–"], ["Region", inv.sapVendor.region || "–"]].map(([k, v]) => `<div><span>${k}</span><b>${esc(v)}</b></div>`).join("")}</div></section>` : ""}
    ${inv.costs && (inv.costs.delivery.length || inv.costs.shipment.length) ? `<section class="card"><div class="card-h"><h3>Freight and shipment costs</h3><span class="muted small">delivery costs on the PO (EKBZ) · shipment cost documents (VFKP)</span></div>
      <div class="tbl"><table><thead><tr><th>Type</th><th>Payable to</th><th class="num">At GR</th><th class="num">Invoiced</th><th class="num">Open</th><th>Documents</th></tr></thead><tbody>
      ${inv.costs.delivery.map(d => `<tr><td class="mono">${esc(d.KSCHL)}</td><td>${esc(d.LIFNR)} ${esc(d.VENDOR)}</td><td class="num">${inr(d.GR_VALUE)}</td><td class="num">${inr(d.IR_VALUE)}</td><td class="num">${inr(d.GR_VALUE - d.IR_VALUE)}</td><td class="mono small">${esc([...d.GR_DOCS, ...d.IR_DOCS].join(", "))}</td></tr>`).join("")}
      ${inv.costs.shipment.map(s => `<tr><td>Shipment ${esc(s.SHIPMENT)}</td><td>${esc(s.CARRIER)}</td><td class="num">${inr(s.VALUE)}</td><td class="num">–</td><td class="num">${s.SETTLED ? "settled" : inr(s.VALUE)}</td><td class="mono small">${esc(s.COST_DOC)}/${esc(s.ITEM)}</td></tr>`).join("")}</tbody></table></div></section>` : ""}
    ${bad.length ? `<section class="card"><div class="card-h"><h3>What needs attention</h3></div><div class="card-b checks">${bad.map(c => `<div class="chk s-${c.status}"><span class="n">${String(c.id).padStart(2, "0")}</span><span class="t">${esc(c.name)}</span>${chip(c.status)}<span class="d">${esc(c.detail)}</span></div>`).join("")}</div></section>`
      : inv.checks ? `<div class="card card-b" style="display:flex;gap:10px;align-items:center">${ic("check")}<span>All ${inv.checks.length} checks passed or are for information only.</span></div>` : ""}`;
}

function wireDrawer(inv) {
  const host = $("#drawerhost");
  host.querySelectorAll("[data-close]").forEach(b => b.onclick = () => { OPEN = null; EDIT = false; host.innerHTML = ""; });
  host.onkeydown = e => { if (e.key === "Escape") { OPEN = null; EDIT = false; host.innerHTML = ""; } };
  // a changed field (e.g. a quantity to park) keeps the drawer from being redrawn by the auto-refresh
  host.querySelectorAll("input, textarea, select").forEach(i => i.addEventListener("input", () => { i.dataset.dirty = "1"; }));
  host.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { DTAB = b.dataset.tab; EDIT = false; renderDrawer(); });
  host.querySelectorAll("[data-a]").forEach(b => b.onclick = () => act(inv, b.dataset.a, b));
}

async function act(inv, a, btn) {
  const rfc = STATE.sapMode === "rfc";
  let body = {};
  if (a === "edit") { EDIT = true; return renderDrawer(); }
  if (a === "cancel-edit") { EDIT = false; return renderDrawer(); }
  if (a === "save-edit") {
    const fields = {}; document.querySelectorAll("#drawerhost [data-f]").forEach(i => fields[i.dataset.f] = i.value);
    const lines = []; document.querySelectorAll("#drawerhost [data-l]").forEach(i => { (lines[i.dataset.l] ??= {})[i.dataset.k] = i.value === "" ? null : Number(i.value); });
    a = "correct"; body = { fields, lines }; EDIT = false;
  }
  if (a === "approve") {
    body.qtys = Object.fromEntries([...document.querySelectorAll("#drawerhost input.qty[data-ebelp]")].map(i => [i.dataset.ebelp, Number(i.value)]));
    if (rfc && !(await modal("Park in SAP?", `<p>This creates a real parked document in <b>${esc(STATE.sapLabel)}</b> and attaches the invoice PDF to it. You can check, post or delete it in MIR4.</p>`, "Park in SAP"))) return;
  }
  if (a === "attach" && rfc && !(await modal("Attach PDF in SAP?", `<p>Adds this invoice PDF to the attachment lists in <b>${esc(STATE.sapLabel)}</b> where it is still missing: invoice document <b>${esc(inv.park.result.INVOICEDOCNUMBER)}/${esc(inv.park.result.FISCALYEAR)}</b>, the purchase order${inv.sapStatus?.fiDoc ? " and the FI document" : ""}.</p>`, "Attach"))) return;
  if (a === "override") { const r = await modal("Approve with override", `<p class="small muted">Blocks on this invoice: ${esc(inv.reason)}. The override and your reason are recorded in the trail.</p><textarea class="input" placeholder="Reason (required)"></textarea>`, "Override & park"); if (!r) return; body.reason = r; }
  if (a === "reject") { const r = await modal("Reject invoice", `<p class="small muted">The vendor and buyer get a mail draft with this reason.</p><textarea class="input">${esc(inv.reason ?? "")}</textarea>`, "Reject", true); if (!r) return; body.reason = r; }
  btn.disabled = true;
  try {
    if (a === "sync") { const r = await api("/api/sync", {}); toast(`${r.changed} of ${r.checked} document(s) changed in SAP`); }
    else { const r = await api(`/api/invoices/${inv.id}/${a}`, body); toast(`${r.id}: ${LABEL[r.status] ?? r.status}`); }
  } catch (e) { toast(e.message); }
  await refresh(false);
}

// ---------------------------------------------------------------- vendor due list (payment run)
// Open vendor invoices from SAP (BSIK): pay-by = net due date, or the MSME 45-day limit when earlier.
let DUE_F = "all", DUE_ROWS = [];
const DUE_FILTERS = { all: ["All open", () => true], overdue: ["Overdue", x => x.DAYS < 0], week: ["Due in 7 days", x => x.DAYS >= 0 && x.DAYS <= 7], msme: ["MSME", x => x.MSME], blocked: ["Payment block", x => !!x.BLOCK] };
function dueList(all) {
  const rows = all.filter(DUE_FILTERS[DUE_F]?.[1] ?? (() => true));
  DUE_ROWS = rows;
  const sum = l => l.reduce((a, x) => a + x.AMOUNT, 0);
  const when = x => x.DAYS < 0 ? `<b style="color:var(--bad)">${-x.DAYS} d overdue</b>` : x.DAYS === 0 ? `<b style="color:var(--warn)">today</b>` : x.DAYS <= 7 ? `<span style="color:var(--warn)">in ${x.DAYS} d</span>` : `in ${x.DAYS} d`;
  return `<div class="card-b" style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">
      ${Object.entries(DUE_FILTERS).map(([k, [l, fn]]) => { const l2 = all.filter(fn); return `<button class="btn ${DUE_F === k ? "primary" : ""}" data-duef="${k}">${esc(l)} · ${l2.length} · ${inr0(sum(l2))}</button>`; }).join("")}
      <div class="grow"></div><button class="btn" data-act="due-csv">${ic("box")}Export CSV</button></div>
    ${rows.length ? `<div class="tbl"><table><thead><tr>${["Pay by", "When", "Vendor", "MSME", "Reference", "FI doc", "Doc date", "Terms", "Open amount", "Part paid", "Block", "Match Book"].map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>
      ${rows.map(x => `<tr><td>${esc(x.PAY_BY)}${x.MSME_DUE && x.MSME_DUE < x.DUE ? `<div class="small muted">MSME limit (terms ${esc(x.DUE)})</div>` : ""}</td><td>${when(x)}</td>
        <td>${esc(x.VENDOR || "–")}<div class="small muted mono">${esc(x.LIFNR)}</div></td><td>${x.MSME ? `<span class="chip s-warn">${esc(x.MSME_TYPE || "MSME")}</span>` : "–"}</td>
        <td class="mono">${esc(x.XBLNR || "–")}</td><td class="mono">${esc(x.BUKRS)}/${Number(x.BELNR)}/${esc(x.GJAHR)}</td><td>${esc(x.BLDAT || "–")}</td><td>${x.TERM_DAYS ? `${x.TERM_DAYS} d` : "due at once"}</td>
        <td style="text-align:right">${inr(x.AMOUNT)}</td><td style="text-align:right">${x.PART_PAID ? inr(x.PART_PAID) : "–"}</td><td>${x.BLOCK ? `<span class="chip s-bad">${esc(x.BLOCK)}</span>` : "–"}</td>
        <td>${x.INV ? `<a href="#" data-open="${x.INV}">${x.INV}</a>` : "–"}</td></tr>`).join("")}</tbody></table></div>` : `<div class="empty-state">${ic("check")}Nothing in this bucket</div>`}
    <p class="small muted" style="margin:8px 16px">Open vendor items from SAP (no down payments). Pay-by is the net due date from the payment terms, or invoice date + 45 days for MSME vendors when that is earlier. Items with a payment block stay out of the weekly digest.</p>`;
}
function dueCsv() {
  const cols = ["PAY_BY", "DAYS", "BUKRS", "LIFNR", "VENDOR", "MSME_TYPE", "XBLNR", "BELNR", "GJAHR", "BLDAT", "BASELINE", "TERM_DAYS", "DUE", "MSME_DUE", "AMOUNT", "PART_PAID", "CURRENCY", "BLOCK", "INV"];
  const q = v => { const s = String(v ?? ""); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const csv = [cols.join(","), ...DUE_ROWS.map(x => cols.map(k => q(x[k])).join(","))].join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
  a.download = `vendor-due-list-${new Date().toISOString().slice(0, 10)}.csv`;
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// ---------------------------------------------------------------- wiring
function wire() {
  const c = $("#content");
  c.querySelectorAll("[data-open]").forEach(el => el.onclick = e => { e.preventDefault(); OPEN = el.dataset.open; DTAB = "overview"; EDIT = false; renderDrawer(); });
  c.querySelectorAll("[data-go]").forEach(el => el.onclick = () => { if (el.dataset.mtab) MTAB = el.dataset.mtab; go(el.dataset.go); });
  c.querySelectorAll("[data-act='due-csv']").forEach(b => b.onclick = () => dueCsv());
  c.querySelectorAll("[data-filter]").forEach(b => b.onclick = () => { FILTER = b.dataset.filter; refresh(false); });
  c.querySelectorAll("[data-mtab]:not([data-go])").forEach(b => b.onclick = () => { MTAB = b.dataset.mtab; refresh(false); });
  c.querySelectorAll("[data-duef]").forEach(b => b.onclick = () => { DUE_F = b.dataset.duef; refresh(false); });
  c.querySelectorAll("[data-msgtab]").forEach(b => b.onclick = () => { MSGTAB = b.dataset.msgtab; refresh(false); });
  const q = $("#q"); if (q) { q.oninput = () => { Q = q.value; clearTimeout(q.t); q.t = setTimeout(() => refresh(false).then(() => { const n = $("#q"); n.focus(); n.setSelectionRange(Q.length, Q.length); }), 250); }; }
  c.querySelectorAll("[data-act='scan']").forEach(b => b.onclick = async () => { b.disabled = true; try { await api("/api/monitor/run", {}); toast("SAP follow-ups refreshed"); } catch (e) { toast(e.message); } refresh(false); });
  c.querySelectorAll("[data-act='sync']").forEach(b => b.onclick = async () => { b.disabled = true; try { const r = await api("/api/sync", {}); toast(`${r.changed} of ${r.checked} changed`); } catch (e) { toast(e.message); } refresh(false); });
  c.querySelectorAll("[data-sent]").forEach(b => b.onclick = async () => { await api(`/api/outbox/${b.dataset.sent}/sent`, {}); refresh(false); });
  c.querySelectorAll("[data-learn]").forEach(b => b.onclick = async () => { await api("/api/learning/toggle", { kind: b.dataset.learn, key: b.dataset.key, off: b.dataset.off === "true" }); refresh(false); });
  c.querySelectorAll("[data-uact]").forEach(b => b.onclick = async () => {
    if (!(await modal(b.dataset.uact === "reset" ? "Reset password?" : `${b.dataset.uact === "disable" ? "Disable" : "Enable"} user?`, `<p>${esc(b.dataset.user)}</p>`, "Yes", b.dataset.uact !== "enable"))) return;
    try { await api(`/api/users/${b.dataset.user}/${b.dataset.uact}`, {}); toast("Done"); } catch (e) { toast(e.message); } refresh(false);
  });
  const uf = $("#uf"); if (uf) uf.onsubmit = async e => { e.preventDefault();
    try { await api("/api/users", { username: $("#un").value, name: $("#ufn").value, personId: $("#upi").value.trim().toUpperCase() || undefined, roles: [...uf.querySelectorAll("input[type=checkbox]:checked")].map(x => x.value) }); toast("User saved. They sign in with the initial password."); refresh(false); }
    catch (x) { toast(x.message); } };
}

// ---------------------------------------------------------------- upload (file picker + drag and drop)
// Listeners sit on the document, so they keep working when the 5-second refresh rebuilds the page.
async function uploadFiles(list) {
  const pdfs = [...list].filter(f => /\.pdf$/i.test(f.name));
  if (!pdfs.length) return toast("Only PDF files can be uploaded");
  let ok = 0;
  for (const f of pdfs) { try { await api(`/api/upload?name=${encodeURIComponent(f.name)}`, f, true); ok++; } catch (x) { toast(`${f.name}: ${x.message}`); } }
  if (ok) toast(`${ok} PDF(s) uploaded: the agents are reading them now`);
  refresh(false);
}
const picker = Object.assign(document.createElement("input"), { type: "file", accept: "application/pdf,.pdf", multiple: true, hidden: true });
document.body.appendChild(picker);
picker.onchange = () => { if (picker.files.length) uploadFiles(picker.files); picker.value = ""; };
document.addEventListener("click", e => { if (e.target.closest("[data-pick]") || (e.target.closest("#drop") && !e.target.closest("button"))) picker.click(); });
document.addEventListener("keydown", e => { if (e.target.id === "drop" && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); picker.click(); } });
["dragenter", "dragover"].forEach(ev => document.addEventListener(ev, e => { const d = e.target.closest?.("#drop"); if (d) { e.preventDefault(); d.classList.add("on"); } }));
document.addEventListener("dragleave", e => { const d = e.target.closest?.("#drop"); if (d && !d.contains(e.relatedTarget)) d.classList.remove("on"); });
document.addEventListener("drop", e => { const d = e.target.closest?.("#drop"); if (!d) return; e.preventDefault(); d.classList.remove("on"); uploadFiles(e.dataTransfer.files); });
// tooltips for chart marks
document.addEventListener("mousemove", e => { const t = e.target.closest("[data-tip]"), tip = $("#tip"); if (!t) { tip.hidden = true; return; } tip.hidden = false; tip.textContent = t.dataset.tip; tip.style.left = Math.min(e.clientX + 12, innerWidth - 220) + "px"; tip.style.top = e.clientY + 14 + "px"; });
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (ME && h && h !== PAGE) go(h); });

// ---------------------------------------------------------------- start
try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
(async () => {
  try { APP = await (await fetch("/api/app")).json(); } catch {}
  const r = await fetch("/api/me");
  if (r.ok) { boot(); } else { const j = await r.json().catch(() => ({})); if (j.mustChange) { ME = {}; renderChangePw(true); } else renderLogin(); }
})();
</script>
